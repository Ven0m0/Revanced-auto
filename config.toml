# Brave (stable). The stock APK comes straight from Brave's GitHub releases; the asset name at the
# end of github-dlurl selects the arm64 Monochrome build (only repo + asset name are used, the
# version still comes from patch compatibility). Opt-in: not previously a build target.
[Brave]
enabled = true
app-name = "Brave"
# kveld9 goes last: later bundles win on duplicate names, and both bundles ship "Brave Origin".
patches-source = ["dh6k/morphe-patches", "kveld9/kveld-morphe-patches"]
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
github-dlurl = "https://github.com/brave/brave-browser/releases/latest/download/BraveMonoarm64.apk"
# GitHub URLs carry no package id, so list-versions needs it spelled out.
package-name = "com.brave.browser"
exclusive = true
# Selection exported from Morphe Manager (morphe_kveld9_Patches_browser-2026-10-25-151331.json and
# morphe_Brave_and_universal__browser-2026-10-25-151334.json).
patches = [
  "Block Motion Sensors",
  "Block Popups & Rating Requests",
  "Block Trackers",
  "Block Tracking SDKs",
  "Brave Origin",
  "Brave Startup Performance Optimization",
  "Clean App Packaging",
  "Clean Start Page",
  "Keep Tabs Open",
  "Remove Extra Files",
  "Remove Extra Languages",
  "Remove Tracking Libraries",
  "Remove Unused Screen Sizes",
  "Select Previous Tab on Close",
  "Shrink PNG Images",
  "Shrink WebP Images",
  "Silence Promo Notifications",
  "Silence System Logs",
  "Skip Welcome Screens",
  "Stop Background Sync",
  "Stop Text Sharing with System",
]

# The universal variants are named "<patch> (Universal)" since kveld9 2.8.0, so "Block Trackers" and
# "Stop Background Sync" here are the Brave-specific patches and take none of the universal options.
[Brave.patch-options."Remove Extra Files"]
removeVpnLibrary = "true"

[Brave.patch-options."Shrink WebP Images"]
stripIcc = "true"

[Brave.patch-options."Silence System Logs"]
logLevel = "\"all\""

[Brave.patch-options."Remove Extra Languages"]
locales = "\"en-US,en-rIN\""

