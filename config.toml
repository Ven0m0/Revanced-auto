# =============================================================================
# ReVanced Auto-Build Configuration
# =============================================================================
# Configuration generator: https://j-hc.github.io/rvmm-config-gen/
# This file controls the behavior of the ReVanced build system
# Documentation:
# - Global settings apply to all apps unless overridden in app-specific sections
# - App sections are defined using [AppName] brackets
# - Use 'enabled = false' to skip building specific apps
# =============================================================================
# GLOBAL BUILD SETTINGS
# =============================================================================
# Parallel Build Jobs
parallel-jobs = 0
# ReVanced Integrations Checks
remove-rv-integrations-checks = true
# Compression Level
compression-level = 9
# Library Stripping (riplib)
riplib = true
# Default Architecture
arch = "arm64-v8a"
# Build Mode
build-mode = "apk"
# Default Patches Version
# - latest: Most recent stable release
# - dev: Latest development version (may be unstable)
patches-version = "latest"
# Default CLI Version
# ReVanced CLI version: "latest", "dev", or specific version tag
cli-version = "latest"
# Default App Version
# App version selection: "auto", "latest", "beta", or specific version
# - auto: Automatically select version compatible with patches
# - latest: Use newest stable version available
# - beta: Use latest beta version
# - Specific version: e.g., "18.48.39"
version = "auto"

# Default patcher CLI and patches: Morphe (T2.1).
# Override per-app via `cli-source` / `patches-source` to fall back to ReVanced or any other ecosystem.
cli-source = "MorpheApp/morphe-cli"
patches-source = "MorpheApp/morphe-patches"

# Alternative Patch Sources (for patches-source):
# - Morphe (default): MorpheApp/morphe-patches
# - Adobo (Morphe-compatible patches): jkennethcarino/adobo
# - External Bundles aggregator: brosssh/revanced-external-bundles
# - ReVanced: ReVanced/revanced-patches
# - ReVanced Extended (anddea): anddea/revanced-patches
# - ReVanced Extended (inotia00): inotia00/revanced-patches
# - De-ReVanced: RookieEnough/De-ReVanced
# - Piko (Twitter): crimera/piko
# - Patcheddit (Reddit): wchill/patcheddit
# - BlazeFTL (universal APK-size/ads/analytics cleanup): BlazeFTL/FTL-Patches
# - Metra TikTok Patches: icysymmetra/tiktok-patches-for-morphe
# - Doom's Morphe Patches: rushiranpise/morphe-patches
# - Brave and universal patches: dh6k/morphe-patches
# - Pinterest Morphed: SouBryan/pinterest-morphed
# - xob0t Morphe Patches: xob0t/morphe-patches
# patches-source accepts a list of the above to merge patches from multiple bundles.

# AAPT2 Optimization
# Enable Android Asset Packaging Tool optimization
# - Reduces APK size by optimizing resources
# - Keeps only: en language, xxhdpi density, arm64-v8a architecture
# - Can reduce APK size by 10-30%
# - Only applies to arm64-v8a APK builds
# Default: true
enable-aapt2-optimize = false

# AAPT2 Binary Source
# GitHub repository to fetch custom aapt2 binary from (dynamically downloaded)
# The binary is cached locally for 7 days to avoid redundant downloads
# Set to "" to disable dynamic fetching and use only system/bundled aapt2
# Default: "Graywizard888/Custom-Enhancify-aapt2-binary"
aapt2-source = "Graywizard888/Custom-Enhancify-aapt2-binary"

# Custom AAPT2 for ReVanced CLI
# Pass --custom-aapt2-binary flag to ReVanced/Morphe CLI during patching
# Ensures the dynamically fetched aapt2 is used for resource processing
# Default: true
use-custom-aapt2 = true

# =============================================================================
# APP CONFIGURATIONS
# =============================================================================
# Each app section can override global settings
# Required fields: at least one download URL (uptodown-dlurl, apkmirror-dlurl, archive-dlurl,
# apkpure-dlurl, aptoide-dlurl, apkmonk-dlurl, or github-dlurl = "https://github.com/owner/repo")
# Optional fields: All global settings can be overridden per-app
# =============================================================================
# Spotify
[Spotify]
enabled = false
uptodown-dlurl = "https://spotify.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.spotify.music"
apkpure-dlurl = "https://apkpure.net/spotify-music-and-podcasts/com.spotify.music"
included-patches = "'Custom theme'"
patcher-args = [
  "-e",
  "Custom branding name for Spotify",
  "-OappName=RVX Spotify",
]

