uptodown-dlurl = "https://tiktok.en.uptodown.com/android"
apkpure-dlurl = "https://apkpure.net/tiktok/com.zhiliaoapp.musically"
exclusive = true
patches = [
  "APK Junk Cleanup",
  "Png Optimizer",
  "Remove Ads",
  "Remove Duplicate Graphics",
  "Remove Languages",
  "Always show publish date",
  "Copy comments without username",
  "Disable long-press quick share",
  "Disable screen capture detection",
  "Downloads",
  "Enable Live search",
  "Feature Gate Lab",
  "Feed filter",
  "Feed tab navigation",
  "Fix Google login",
  "Hide CAPTCHA popups",
  "Hide floating promotions",
  "Hide quick comment reactions",
  "Open external links directly",
