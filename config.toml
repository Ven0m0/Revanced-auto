# =============================================================================
# ReVanced Auto-Build Configuration
# =============================================================================
# Config generator: docs/generator.html. Key reference: docs/CONFIG.md
# This file controls the behavior of the ReVanced build system
# Documentation:
# - Global settings apply to all apps unless overridden in app-specific sections
# - App sections are defined using [AppName] brackets
# - Use 'enabled = false' to skip building specific apps
# =============================================================================
# GLOBAL BUILD SETTINGS
# =============================================================================
# Parallel Build Jobs
parallel-jobs = 0
# Library Stripping (riplib)
riplib = true
# Default Architecture
arch = "arm64-v8a"
# Default Patches Version
# - latest: Most recent stable release
# - dev: Latest development version (may be unstable)
patches-version = "latest"
# Default CLI Version
# ReVanced CLI version: "latest", "dev", or specific version tag
cli-version = "latest"

# Default patcher CLI and patches: Morphe. Every bundle below runs on the Morphe CLI.
# Override per app via `cli-source` / `patches-source`.
cli-source = "MorpheApp/morphe-cli"
patches-source = "MorpheApp/morphe-patches"

# Patch sources used by the sections below (see docs/PATCHES.md):
# - Morphe (default): MorpheApp/morphe-patches
# - Adobo: jkennethcarino/adobo
# - BlazeFTL (universal APK-size/ads/analytics cleanup): BlazeFTL/FTL-Patches
# - Hushfeed (TikTok): SysAdminDoc/hushfeed
# - Doom's Morphe Patches (Google Photos): rushiranpise/morphe-patches
# - Brave and universal patches: dh6k/morphe-patches
# - kveld9 (Brave, Discord cleanup): kveld9/kveld-morphe-patches
# - kveld9 Extra (SD Maid): kveld9/kveld-extra-morphe-patches
# - SoundCloud: kondratjev/morphe-patches
# - Google Maps (microG): Dutch App Patches, a GitLab patches-bundle.json URL (see docs/CONFIG.md)
# - Discord: VenusIsJaded/Venus-Patches, jrddupont/discord-patches
# - External bundles aggregator: brosssh/revanced-external-bundles
# patches-source accepts a list of the above to merge patches from multiple bundles.

# =============================================================================
# APP CONFIGURATIONS
# =============================================================================
# Each app section can override: arch, patches-source, patches-version, cli-source (the other global keys are global-only)
# Required fields: at least one download URL (apkmirror-dlurl, archive-dlurl, apkpure-dlurl,
# github-dlurl = "https://github.com/owner/repo", aptoide-dlurl, apkmonk-dlurl or uptodown-dlurl)
# Per-app only: app-name, rv-brand, package-name, version, patches, exclude-patches, exclusive, patch-options
# =============================================================================
# TikTok. Hushfeed (SysAdminDoc/hushfeed) plus kveld9 cleanup patches. Selection exported from Morphe Manager
# (morphe_manager_settings.json, 2026-11-11). No version pin: Hushfeed supports only the TikTok versions it lists,
# and `auto` resolves one of them (the build never passes --force).
# Hushfeed "Remove unused language packs" is left out: it makes TikTok patching fail. kveld9 handles the languages.
