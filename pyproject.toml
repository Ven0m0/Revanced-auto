[build-system]
requires = ["uv_build>=0.12.3", "setuptools>=84.0.0"]
build-backend = "uv_build"

[project]
name = "revanced-auto"
version = "1.0.0"
description = "ReVanced Builder: Automated APK patching and building system"
requires-python = ">=3.14,<3.15"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "ReVanced Builder Contributors" }]
dependencies = [
  "httpx[http2]>=0.28.1",
  "orjson>=3.11.8",
  "selectolax>=0.4.11",
  "beautifulsoup4>=4.15.0",
  "curl-cffi>=0.15.0",
]

[dependency-groups]
dev = [
  "hypothesis>=6.165.1",
  "mypy>=2.3.0",
  "basedpyright>=1.39.3",
  "ty>=0.0.66",
  "prek>=0.4.11",
  "tombi>=1.2.6",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "pytest-durations>=1.7.0",
  "ruff>=0.16.0",
  "types-toml>=0.10.8.20240310",
  "vulture>=2.16",
]
[project.optional-dependencies]
# Keep [project.optional-dependencies].dev aligned with [dependency-groups].dev
# so pip and uv users install the same local tooling.
dev = [
  "hypothesis>=6.165.1",
  "mypy>=2.3.0",
  "basedpyright>=1.39.3",
  "ty>=0.0.66",
  "prek>=0.4.11",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=6.0.0",
  "pytest-durations>=1.7.0",
  "ruff>=0.16.0",
  "types-toml>=0.10.8.20240310",
]

[tool.mypy]
python_version = "3.14"
strict = true
strict_optional = true
disallow_any_generics = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
enable_error_code = [
  "ignore-without-code",
  "unused-awaitable",
  "possibly-undefined"
]

[tool.ruff]
line-length = 120
target-version = "py314"
fix = true
exclude = [
  ".git",
  ".cache",
  ".var",
  ".venv",
  "venv",
  "node_modules",
  "__pycache__",
  "*.pyc",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "EXE001",  # shebang executability is not enforced for repo-managed Python modules
  "E501",  # line too long (handled by formatter)
  "T201",  # print() in CLI scripts is intentional
  "BLE001",  # broad exception in CLI error handlers is acceptable
  "COM812",  # trailing comma conflicts with formatter
  "CPY001",  # repo has no copyright header convention
]

