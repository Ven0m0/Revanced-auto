name: Build
permissions:
  contents: write
  actions: read
on:
  schedule:
    # Cheap patch-update probe; the build itself only runs when check_updates finds a new patches release.
    # Off the top of the hour: GitHub delays or drops scheduled runs at :00 under load.
    - cron: "17 */6 * * *"
  workflow_call:
    inputs:
      publish_release:
        type: boolean
        required: false
        default: true
  workflow_dispatch:
    inputs:
      app_name:
        description: App to build (leave empty to build all enabled apps)
        required: false
        default: ""
        type: string
      version:
        description: App version override (auto = newest patch-compatible, latest, beta, or a specific version like 18.48.39). Applied to every app being built.
        required: false
        default: auto
        type: string
      architecture:
        description: Target architecture override. Applied to every app being built, so leave app_name set to limit it to one app.
        required: false
        default: arm64-v8a
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
          - both
      publish_release:
        description: Publish to GitHub Releases
        required: false
        default: true
        type: boolean
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.app_name }}
  # A scheduled probe must not cancel a running manual build that shares the group.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}
jobs:
  check_updates:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs_build: ${{ steps.check.outputs.needs_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install mise-managed toolchain (Python, uv)
        uses: jdx/mise-action@v5.2.4
        with:
          install: true
          cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Check for patch updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python -m scripts.version_tracker check --config config.toml
  setup_matrix:
    needs: check_updates
    if: ${{ !cancelled() && (needs.check_updates.result == 'skipped' || needs.check_updates.outputs.needs_build == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install mise-managed toolchain (Python, uv)
        uses: jdx/mise-action@v5.2.4
        with:
          install: true
          cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Generate Matrix
        id: set-matrix
        env:
          APP_FILTER: ${{ inputs.app_name }}
        run: |
          MATRIX=$(uv run python -m scripts.cli matrix "${APP_FILTER}")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
  apk_matrix:
    needs: setup_matrix
    # Without this, the implicit success() fails when check_updates was skipped (manual dispatch), skipping every build.
    if: ${{ !cancelled() && needs.setup_matrix.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup_matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          submodules: true
      - name: Setup build environment
        uses: ./.github/actions/setup-environment
      - name: Cache ReVanced prebuilts
        uses: actions/cache@v6
        with:
          path: .cache/prebuilts
          key: ${{ runner.os }}-prebuilts-${{ matrix.id }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-prebuilts-${{ matrix.id }}-
            ${{ runner.os }}-prebuilts-
      - name: Generate ${{ matrix.id }} config
        env:
          APP_NAME: ${{ matrix.id }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARCH: ${{ inputs.architecture }}
        run: |
          uv run python -m scripts.cli extras separate-config config.toml "${APP_NAME}" sep_config.json
          # Apply manual-dispatch version/arch overrides, if given
          if [[ -n "${INPUT_VERSION:-}" && "${INPUT_VERSION}" != "auto" ]] || [[ -n "${INPUT_ARCH:-}" ]]; then
            uv run python3 - <<'PYEOF'
          import json
          import os

          with open("sep_config.json") as f:
              config = json.load(f)

          app = config[os.environ["APP_NAME"]]

          version = os.environ.get("INPUT_VERSION", "")
          if version and version != "auto":
              app["version"] = version

          arch = os.environ.get("INPUT_ARCH", "")
          if arch:
              app["arch"] = arch

          with open("sep_config.json", "w") as f:
              json.dump(config, f)
          PYEOF
          fi
          cat sep_config.json
      - name: Build APKs
        # Headed Chrome under a virtual display: APKMirror's Cloudflare challenge (e.g. Discord) hard-blocks headless.
        run: xvfb-run -a uv run python -m scripts.cli build --config sep_config.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
      - name: Upload APKs as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: apks-${{ matrix.id }}
          path: ./build/*.apk
          if-no-files-found: warn
          retention-days: 1
      - name: Upload CF debug (TEMP-DEBUG)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cf-debug-${{ matrix.id }}
          path: build/cf-*
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload build log as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.id }}
          path: build.md
          if-no-files-found: warn
          retention-days: 1
  release:
    needs: apk_matrix
    if: ${{ !cancelled() && needs.apk_matrix.result != 'skipped' && (github.event_name == 'schedule' || inputs.publish_release != false) && github.repository == github.event.repository.full_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Install mise-managed toolchain (Python, uv)
        uses: jdx/mise-action@v5.2.4
        with:
          install: true
          cache: true
      - name: Install Python dependencies
        run: uv sync --locked --all-groups
      - name: Check if any artifacts exist
        id: check_artifacts
        continue-on-error: true
        run: |
          if gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts \
            --jq '.artifacts[] | select(.name | startswith("apks-")) | .name' | grep -q .; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare version
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        id: version
        run: |
          # Run number keeps same-day builds on distinct tags, so Obtainium sees each as an update.
          VER="$(date +%y.%m.%d)-${{ github.run_number }}"
          echo "version=${VER}" >> $GITHUB_OUTPUT
      - name: Download all APKs
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: apks-*
          path: all-apks
          merge-multiple: true
      - name: Download all build logs
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: build-log-*
          path: build-logs
      - name: Combine build logs
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          uv run python -m scripts.cli extras combine-logs build-logs >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
      - name: Cleanup old releases
        # Full builds only: a single-app build must not push the other apps' last good APKs out of the kept window.
        if: steps.check_artifacts.outputs.has_artifacts == 'true' && inputs.app_name == ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the newest 10 releases (listed newest first); apps that failed this run keep their last APK there.
          gh release list --limit 100 --json tagName -q ".[].tagName" | \
            tail -n +11 | \
            while read -r tag; do
              echo "Cleaning old release: $tag"
              gh release delete "$tag" -y --cleanup-tag 2>/dev/null || true
            done
      - name: Upload APKs to release
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        uses: svenstaro/upload-release-action@2.11.5
        with:
          body: ${{ steps.get_output.outputs.BUILD_LOG }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: all-apks/*.apk
          release_name: ${{ steps.version.outputs.version }}
          tag: ${{ steps.version.outputs.version }}
          file_glob: true
          overwrite: true
      - name: Save build state
        # A single-app build must not mark every app as built.
        if: steps.check_artifacts.outputs.has_artifacts == 'true' && inputs.app_name == ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python -m scripts.cli version-tracker save --config config.toml
      - name: Commit build state
        if: steps.check_artifacts.outputs.has_artifacts == 'true' && inputs.app_name == ''
        continue-on-error: true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update build versions state [skip ci]"
          file_pattern: .github/last_built_versions.json
