name: Release
# Maintains CHANGELOG.md and the version in pyproject.toml from Conventional
# Commits. On every push to main it opens or updates a release pull request.
# When the release PR is merged, the googleapis/release-please-action creates
# a tag and GitHub Release. APK builds and their date-based releases stay in
# build.yml - this workflow only tracks the source-code version and changelog.
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    name: Release please
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
